# Render Blueprint — Infrastructure as Code
# This file provisions all Render services when you click "New > Blueprint" in the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: backstage
    runtime: docker
    # Path to the Dockerfile, relative to repo root
    dockerfilePath: ./packages/backend/Dockerfile
    # Docker build context = repo root (needed for monorepo)
    dockerContext: .
    plan: free
    branch: main
    envVars:
      # Set this to your Render service URL after first deploy
      # e.g. https://backstage-xxxx.onrender.com
      - key: APP_BASE_URL
        value: https://backstage-mcmw.onrender.com

      # GitHub integration token — enter value in Render dashboard
      - key: GITHUB_TOKEN
        sync: false

      # GitHub OAuth credentials — enter values in Render dashboard
      - key: AUTH_GITHUB_CLIENT_ID
        sync: false

      - key: AUTH_GITHUB_CLIENT_SECRET
        sync: false

      # Backend-to-backend auth secret — auto-generated by Render
      - key: BACKEND_SECRET
        generateValue: true

      # Supabase PostgreSQL connection details
      - key: POSTGRES_HOST
        value: aws-0-ap-northeast-2.pooler.supabase.com

      - key: POSTGRES_PORT
        value: 5432

      - key: POSTGRES_USER
        value: postgres.jpafwfmtsjvzwofhqadv

      - key: POSTGRES_DB
        value: postgres

      # ⚠️ Enter your Supabase password in the Render dashboard — do NOT commit it here
      - key: POSTGRES_PASSWORD
        sync: false
